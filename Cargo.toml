[workspace]
resolver = "2"
members = [
    "crates/ilibx-core",
    "crates/ilibx-ffi",
    "crates/ilibx-rust",
    "tools/datagen",
    "tools/ilibx-dump",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Provisional. Set to the rustc version shipped by webOS Yocto once confirmed.
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/iLib-js/ilibx"

[profile.release]
lto = true
codegen-units = 1
