# Generates include/ilibx.h from crates/ilibx-ffi.
#   cbindgen --config cbindgen.toml --crate ilibx-ffi --output include/ilibx.h
language = "C"
include_guard = "ILIBX_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from crates/ilibx-ffi. Do not edit by hand. */"
header = "/* SPDX-License-Identifier: Apache-2.0 */"
usize_is_size_t = true

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export]
include = ["IlibxStatus"]
