name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  # ilibx-core must stay no_std: build it for a target with no OS.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build --locked -p ilibx-core --target thumbv7em-none-eabi

  # libilibx.so: versioned soname, no reference to libicu*.
  shared-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked -p ilibx-ffi
      - run: readelf -d target/debug/libilibx.so | grep -q 'SONAME.*\[libilibx\.so\.1\]'
      - run: "! readelf -d target/debug/libilibx.so | grep -i icu"

  # ICU dependency 0.
  no-icu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
      - run: ./scripts/check-no-icu.sh

  # Minimum supported Rust version (provisional until the webOS Yocto rustc is confirmed).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - run: cargo build --workspace --locked
